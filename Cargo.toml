[package]
name = "cftui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cloudflare metrics, HTTP inspection, and an embedded Bash terminal"

[profile.release]
strip = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
portable-pty = "0.9"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tui-term = "0.3.4"
